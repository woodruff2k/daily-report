name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Check (format, lint, test, integration, build)
    runs-on: ubuntu-latest

    # 통합 테스트 전용 DB. 자격증명은 이 컨테이너 안에서만 쓰는 더미다.
    # 통합 테스트의 안전장치 때문에 DB 이름은 반드시 `_test` 로 끝나야 한다.
    # pg_stat_activity 를 조회하는 헬퍼가 있어 슈퍼유저(postgres)를 쓴다.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 싼 검사부터 돌려 빨리 실패시킨다.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 실제 PostgreSQL 에 붙는 통합 테스트(목 없음). 스키마는 테스트의
      # globalSetup 이 `prisma migrate deploy` 로 맞추므로 여기서 마이그레이션하지
      # 않는다. JWT_SECRET 은 vitest.integration.config.ts 가 주입한다.
      # 포트 5432 는 위 서비스 컨테이너의 매핑이다(로컬 compose 는 5433).
      - name: Integration test
        run: npm run test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/daily_report_test

      # vitest·eslint·tsc 가 못 잡는 빌드 전용 오류를 잡는다. 서버 컴포넌트에서
      # 클라이언트 전용 API 를 쓰는 경우("use client" 누락)를 실제로 확인했다 —
      # 세 검사는 통과하고 빌드만 실패한다.
      #
      # 반면 동적 라우트의 params 를 Promise 아닌 형으로 쓰는 것은 Next 16 의
      # 빌드가 잡지 않는다. 이슈 #45 본문의 그 예시는 사실이 아니었다.
      #
      # 아래 두 값은 더미다. 실제 시크릿이 아니고, 빌드는 DB 에 접속하지 않는다.
      # 지금은 이 값들이 없어도 빌드가 통과한다 — JWT_SECRET 은 요청 시점에
      # 함수 안에서 읽고, Prisma 는 생성 시점에 URL 을 검증하지 않는다.
      # 그래도 박아두는 이유는 그 조건이 깨지는 변경(빌드 시점에 평가되는
      # 코드가 환경 변수를 읽거나, Prisma 가 검증을 조이는 경우)이 CI 에서만
      # 드러나기 때문이다. 값은 해롭지 않고 실패는 비싸다.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/db?schema=public
          JWT_SECRET: ci-build-only-not-a-real-secret
