name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Check (format, lint, typecheck, prisma, test, integration, build)
    runs-on: ubuntu-latest

    # 통합 테스트 전용 DB. 자격증명은 이 컨테이너 안에서만 쓰는 더미다.
    # 통합 테스트의 안전장치 때문에 DB 이름은 반드시 `_test` 로 끝나야 한다.
    # pg_stat_activity 를 조회하는 헬퍼가 있어 슈퍼유저(postgres)를 쓴다.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 의존성 취약점 리포트(#97). 비차단(continue-on-error)으로 둔다.
      #  - 차단(--audit-level=critical)은 지금 켜면 바로 빨개진다: 전체 audit 에
      #    proxy-addr 가 critical 로 남아 있다(shadcn → MCP SDK 경유, 개발 전용).
      #    #102 로 next 권고는 없어졌으니 그 하나만 정리되면 차단으로 올릴 수 있다.
      #  - 건수를 0 으로 만드는 것이 목적이 아니다. 전이 의존은 상위 패키지가 올라가야
      #    사라지고 `npm audit fix --force` 는 prisma 를 6.12.0 으로 *내린다*.
      #  - 전체(dev 포함)로 본다. `--omit=dev` 는 빌드·테스트 도구 체인을 못 봐서,
      #    빌드 머신에서 도는 것을 놓친다. (next·react 는 #102 에서 dependencies 로
      #    옮겨 이제 양쪽에 다 보인다.)
      #  - 남아 있는 건과 "왜 괜찮은지"는 이슈 #97 에 정리했다. 운영 기준 3건은 모두
      #    prisma CLI 경유(@prisma/config → deepmerge-ts)이고 실행 이미지에 없다.
      #    6.x 안에 fix 가 없어 올리지도 내리지도 않았다.
      # 로그의 요약을 보고, 새 critical 이 늘면 별도로 처리한다. 차단으로 바꾸려면
      # continue-on-error 를 지우고 --audit-level=critical 을 붙인다.
      - name: Dependency audit (non-blocking)
        run: npm audit
        continue-on-error: true

      # 싼 검사부터 돌려 빨리 실패시킨다.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # 타입 오류를 여기서 잡는다. next build 는 테스트 파일을 보지 않아, 테스트에
      # 생긴 타입 오류가 CI 를 통과했다(PR #91). vitest 도 타입 검사를 하지 않는다.
      - name: Typecheck
        run: npm run typecheck

      # 스키마·마이그레이션 정합. 둘 다 DB 없이 단위 테스트를 통과하므로 어긋나도
      # `npm test` 는 모른다. 통합 테스트는 마이그레이션만 적용하므로 schema.prisma 를
      # 고치고 마이그레이션을 빠뜨려도, 그 테이블을 읽는 테스트가 없으면 통과한다.
      # 인덱스·제약·열거형 변경은 어느 쪽으로도 드러나지 않는다. (#93)
      #   1) validate: schema.prisma 문법. DATABASE_URL 은 형식만 필요한 더미다.
      #   2) migrate diff: 마이그레이션을 빈 shadow DB 에 적용한 결과와 schema.prisma 의
      #      차이. 다르면 종료 코드 2. shadow DB 는 서비스 컨테이너에 따로 만든다 —
      #      Prisma 가 이 DB 를 비우므로 통합 테스트용 DB 를 쓰지 않는다.
      - name: Prisma schema
        run: |
          npx prisma validate
          # DROP 을 먼저 한다 — 없으면 두 번째 실행이 "already exists" 로 죽고,
          # `bash -e` 라 migrate diff 가 아예 안 돈다. CI 는 매번 새 컨테이너라
          # 문제가 없지만 이 블록을 로컬에서 그대로 따라 돌릴 수 있어야 한다.
          echo "DROP DATABASE IF EXISTS daily_report_shadow;" | npx prisma db execute --url "$ADMIN_URL" --stdin
          echo "CREATE DATABASE daily_report_shadow;" | npx prisma db execute --url "$ADMIN_URL" --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_URL" \
            --exit-code
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/db?schema=public
          ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SHADOW_URL: postgresql://postgres:postgres@127.0.0.1:5432/daily_report_shadow

      # 커버리지를 같은 실행에서 잰다(테스트를 두 번 돌리지 않는다). 임계값은
      # vitest.config.ts 에 있고, 현재 수치에서 내려가면 여기서 실패한다.
      - name: Test (coverage)
        run: npm run test:coverage

      # 실제 PostgreSQL 에 붙는 통합 테스트(목 없음). 스키마는 테스트의
      # globalSetup 이 `prisma migrate deploy` 로 맞추므로 여기서 마이그레이션하지
      # 않는다. JWT_SECRET 은 vitest.integration.config.ts 가 주입한다.
      # 포트 5432 는 위 서비스 컨테이너의 매핑이다(로컬 compose 는 5433).
      - name: Integration test
        run: npm run test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/daily_report_test

      # vitest·eslint·tsc 가 못 잡는 빌드 전용 오류를 잡는다. 서버 컴포넌트에서
      # 클라이언트 전용 API 를 쓰는 경우("use client" 누락)를 실제로 확인했다 —
      # 세 검사는 통과하고 빌드만 실패한다.
      #
      # 반면 동적 라우트의 params 를 Promise 아닌 형으로 쓰는 것은 Next 16 의
      # 빌드가 잡지 않는다. 이슈 #45 본문의 그 예시는 사실이 아니었다.
      #
      # 아래 두 값은 더미다. 실제 시크릿이 아니고, 빌드는 DB 에 접속하지 않는다.
      # 지금은 이 값들이 없어도 빌드가 통과한다 — JWT_SECRET 은 요청 시점에
      # 함수 안에서 읽고, Prisma 는 생성 시점에 URL 을 검증하지 않는다.
      # 그래도 박아두는 이유는 그 조건이 깨지는 변경(빌드 시점에 평가되는
      # 코드가 환경 변수를 읽거나, Prisma 가 검증을 조이는 경우)이 CI 에서만
      # 드러나기 때문이다. 값은 해롭지 않고 실패는 비싸다.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/db?schema=public
          JWT_SECRET: ci-build-only-not-a-real-secret
